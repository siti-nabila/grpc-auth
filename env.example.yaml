ApplicationName: USER_AUTH_SERVICE
Environment: development
DebugMode: false
Port: 50051
Host: localhost
Timeout: 5s
KeepAlive: 2m
KeepAliveTimeout: 3s
KeepAliveIdle: 15m

Database:
  User:
    User: ""
    Password: ""
    Host: localhost
    Port: 5432
    Name: ""
    Driver: postgres

JWT:
  SecretKey: "" # Legacy config compatibility only; unused by the default pipeline

# Required by default startup before pools, logger or listener are opened.
AccessIssuer:
  PrivateKeyFile: "" # One PKCS#8 Ed25519 PRIVATE KEY PEM, provisioned locally
  PublicKeyFile: "" # Matching PKIX Ed25519 PUBLIC KEY PEM
  KeyVersion: "" # Explicit operational identifier; no HS256 fallback
AuthLimiter:
  AccountHMACSecret: "" # Separate secret, never reuse JWT/service credentials
CommandFingerprint:
  ActiveVersion: "v1"
  Keys:
    v1: "" # Required independent secret, minimum 32 bytes; no default
    # Retain older versions until all dependent 24-hour replay records expire.

TLS:
  CertFile: "" # PEM server certificate chain; required, no plaintext fallback
  KeyFile: "" # PEM matching private key, supplied locally

ServiceAuth:
  Callers:
    - ServiceID: rest-orc
      Current:
        SHA256: "" # Hex SHA-256 of the encoded opaque token; never put the token here
        NotAfter: "" # Explicit future RFC3339 timestamp
      # Previous is optional. When rotating, explicitly configure all three:
      # Previous:
      #   SHA256: ""
      #   NotAfter: ""
      #   OverlapUntil: "" # Within both credentials lifetimes; remove after overlap
      Methods:
        - /authorization.v1.AuthorizationService/EvaluateAccess
        - /audit.v1.AuditService/ListAuditLogs
        - /user.v1.UserService/Register
        - /user.v1.UserService/Login
        - /user.v1.UserService/TesRPC
        - /user.v1.UserService/Me
        - /user.v1.UserService/GetUser
        - /user.v1.UserService/CreateUser
        - /user.v1.UserService/UpdateUser
        - /user.v1.UserService/ChangeUserStatus
        - /user.v1.UserService/ListUserRoles
        - /user.v1.UserService/GrantUserRoles
        - /user.v1.UserService/RevokeUserRoles
        - /user.v1.UserService/ListUserApplicationAccess
        - /user.v1.UserService/GetMyEffectivePermissions
        - /user.v1.UserService/GetUserEffectivePermissions
        - /application.v1.ApplicationService/GrantApplicationAccess
        - /application.v1.ApplicationService/RevokeApplicationAccess
        - /application.v1.ApplicationService/ListApplications
        - /permission.v1.PermissionService/ListPermissions
        - /role.v1.RoleService/ListRoles
        - /role.v1.RoleService/GetRole
        - /role.v1.RoleService/CreateRole
        - /role.v1.RoleService/UpdateRole
        - /role.v1.RoleService/ChangeRoleStatus
        - /role.v1.RoleService/ReplaceRolePermissions
        - /user.v1.UserService/ListUsers
        - /profile.v1.ProfileService/UpdateProfile
        - /auth.v1.AuthService/RefreshSession
        - /auth.v1.AuthService/Logout
        - /auth.v1.AuthService/ChangePassword
        - /session.v1.SessionService/ListMySessions
        - /session.v1.SessionService/RevokeMySession
        - /session.v1.SessionService/RevokeAllMySessions
        - /session.v1.SessionService/ListUserSessions
        - /session.v1.SessionService/RevokeUserSession
        - /session.v1.SessionService/RevokeAllUserSessions
      Namespaces: [iam, clm]

Logger:
  HTTPMode: stdout
  DBMode: stdout
